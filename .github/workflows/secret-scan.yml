name: Secret scanning

on:
  push:
  pull_request:
  schedule:
    - cron: "37 4 * * 1"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: trufflesecurity/trufflehog@v3.99.9
        with:
          extra_args: --only-verified